<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <section class="screen screen-app" id="screen-gestao">

        <span>
            <header class="app-bar-professor">
                <span class="app-bar-title">página escolar</span>
                <button class="app-bar-menu" aria-label="menu">☰</button>
            </header>
        </span>

        </div>

        <div>
            <img src="">
        </div>

        <div class="back-row">
            <button class="btn-voltar" data-voltar>← voltar</button>
        </div>

        <div class="card-body" id="professor-menu">
            <div class="stack">
                <button class="nav-btn nav-blue" data-ir="escola-1-professor" data-em-breve="1">
                    <span class="nav-icon">👤</span>
                    <span class="nav-label">Escola 1</span>
                    <span class="nav-arrow">›</span>
                </button>

                <button class="nav-btn nav-yellow" data-ir="escola-2-professor" data-em-breve="1">
                    <span class="nav-icon">👥</span>
                    <span class="nav-label">Escola 2</span>
                    <span class="nav-arrow">›</span>
                </button>

                <button class="nav-btn nav-blue" data-ir="escola-3-professor" data-em-breve="1">
                    <span class="nav-icon">👥</span>
                    <span class="nav-label">Escola 3</span>
                    <span class="nav-arrow">›</span>
                </button>
            </div>

            <p class="em-breve" id="professor-aviso" hidden></p>

            <div class="home-bar">
                <button class="home-btn" id="btn-home-professor" aria-label="início" data-home>⌂</button>
            </div>
        </div>

    </section>

</body>

</html>
