<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Página da Escola - Agenda Escolar</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* =========================
           CONFIGURAÇÕES GERAIS
        ========================= */

        body {
            background-color:
                #111827;

            font-family: Arial, sans-serif;

            margin: 0;

            padding: 20px;

            display: flex;

            justify-content: center;
        }

        /* =========================
           ESTRUTURA DA PÁGINA
        ========================= */

        .pagina {
            background-color:
                #f5f5f5;

            width: 100%;

            max-width: 430px;

            min-height: 850px;

            border-radius: 14px;

            overflow: hidden;

            display: flex;

            flex-direction: column;
        }

        /* =========================
           BARRA SUPERIOR
        ========================= */

        .barra-superior {
            background-color:
                #ffffff;

            color:
                #111111;

            padding: 12px 20px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            font-size: 14px;
        }

        .barra-superior i {
            margin-left: 5px;
        }

        /* =========================
           CABEÇALHO
        ========================= */

        header {
            background-color:
                #f97316;

            color: white;

            padding: 18px 20px;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }

        header h1 {
            font-size: 23px;

            font-weight: normal;

            margin: 0;
        }

        header i {
            font-size: 30px;

            cursor: pointer;
        }

        /* =========================
           BANNER DA ESCOLA
        ========================= */

        .banner {
            width: 100%;

            height: 200px;

            object-fit: cover;

            display: block;
        }

        /* =========================
           CONTEÚDO PRINCIPAL
        ========================= */

        main {
            padding: 20px;

            flex: 1;
        }

        /* =========================
           VOLTAR
        ========================= */

        .voltar {
            display: inline-block;

            color:
                #333333;

            text-decoration: none;

            font-size: 16px;

            margin-bottom: 20px;
        }

        .voltar i {
            margin-right: 8px;
        }

        /* =========================
           CARD DOS BOTÕES
        ========================= */

        .card {
            background-color:
                #ffffff;

            border-radius: 16px;

            padding: 15px;

            min-height: 400px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        /* =========================
           BOTÕES
        ========================= */

        .botao {
            width: 100%;

            height: 65px;

            padding: 0 18px;

            border: none;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            color: white;

            font-family: Arial, sans-serif;

            font-size: 15px;

            cursor: pointer;

            margin-bottom: 15px;

            text-align: left;

            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.12);

            transition: 0.2s;
        }

        .botao span {
            display: flex;

            align-items: center;

            gap: 12px;
        }

        .botao span i {
            font-size: 22px;
        }

        /* =========================
           CORES DOS BOTÕES
        ========================= */

        .azul {
            background-color:
                #3498f5;
        }

        .laranja {
            background-color:
                #ff9900;
        }

        /* =========================
           EFEITO DOS BOTÕES
        ========================= */

        .botao:hover {
            filter: brightness(1.05);
        }

        .botao:active {
            transform: scale(0.98);
        }

        /* =========================
           RODAPÉ
        ========================= */

        footer {
            background-color:
                #f5f5f5;

            padding: 18px;

            text-align: center;

            border-top: 1px solid #dddddd;
        }

        footer i {
            font-size: 27px;

            color:
                #555555;

            cursor: pointer;
        }

        /* =========================
           RESPONSIVIDADE
        ========================= */

        @media (max-width: 480px) {

            body {
                padding: 0;
            }

            .pagina {
                max-width: 100%;

                min-height: 100vh;

                border-radius: 0;
            }

            header h1 {
                font-size: 21px;
            }

            .banner {
                height: 190px;
            }

            .card {
                min-height: 350px;
            }

        }
    </style>

</head>

<body>

    <!-- =========================
         PÁGINA DA ESCOLA
    ========================= -->

    <div class="pagina">

        <!-- =========================
             BARRA SUPERIOR
        ========================= -->

        <div class="barra-superior">

            <span>
                9:30
            </span>

            <span>

                <i class="bi bi-reception-4"></i>

                <i class="bi bi-wifi"></i>

                <i class="bi bi-battery-full"></i>

            </span>

        </div>

        <!-- =========================
             CABEÇALHO LARANJA
        ========================= -->

        <header>

            <h1>
                página da escola
            </h1>

            <i class="bi bi-list"></i>

        </header>

        <!-- =========================
             BANNER DA ESCOLA
        ========================= -->

        <img class="banner" src="https://images.unsplash.com/photo-1503676260728-1c00da094a0b" alt="Imagem da escola">

        <!-- =========================
             CONTEÚDO PRINCIPAL
        ========================= -->

        <main>

            <!-- VOLTAR -->

            <a href="#" class="voltar">

                <i class="bi bi-arrow-left"></i>

                voltar

            </a>

            <!-- =========================
                 CARD DOS BOTÕES
            ========================= -->

            <section class="card">

                <!-- =========================
                     COMUNICADOS DA ESCOLA
                ========================= -->

                <button class="botao azul" type="button">

                    <span>

                        <i class="bi bi-person"></i>

                        comunicados da escola

                    </span>

                    <i class="bi bi-chevron-right"></i>

                </button>

                <!-- =========================
                     HORÁRIO ESCOLAR
                ========================= -->

                <button class="botao laranja" type="button">

                    <span>

                        <i class="bi bi-clock"></i>

                        Horário escolar

                    </span>

                    <i class="bi bi-chevron-right"></i>

                </button>

            </section>

        </main>

        <!-- =========================
             RODAPÉ
        ========================= -->

        <footer>

            <i class="bi bi-house-door"></i>

        </footer>

    </div>

</body>

</html>
