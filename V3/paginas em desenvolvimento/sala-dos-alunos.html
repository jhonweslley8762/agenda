<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <section class="screen screen-app" id="screen-gestao">

        <header class="app-bar-gestao">
            <span class="app-bar-title">página das escolas</span>
            <button class="app-bar-menu" aria-label="menu">☰</button>
        </header>

        <div class="back-row">
            <button class="btn-voltar" data-voltar>← voltar</button>
        </div>

        <div class="card-body" id="gestao-menu">
            <div class="stack" id="barra-atividades-professor">
                <button class="nav-btn nav-yellow" data-ir="atv-1" data-em-breve="1">
                    <span class="nav-label">atividade 1</span>
                </button>

                <button class="nav-btn nav-yellow" data-ir="atv-2" data-em-breve="1">

                    <span class="nav-label">atividade 2</span>

                </button>

                <button class="nav-btn nav-yellow" data-ir="atv-3" data-em-breve="1">

                    <span class="nav-label">atividade 3</span>

                </button>

                <button class="nav-btn nav-yellow" data-ir="teste-btn" data-em-breve="1">

                    <span class="nav-label">teste 30/8</span>

                </button>

                <button class="nav-btn nav-yellow" data-ir="prova-trimestral" data-em-breve="1">

                    <span class="nav-label">prova trimestral</span>

                </button>

                <button class="nav-btn nav-yellow" data-ir="lista-frequencia-professor" data-em-breve="1">

                    <span class="nav-label">frequencia</span>
                </button>
            </div><br>

            <div>
                <button class="nav-btn nav-blue" data-ir="comunicados-escola" data-em-breve="1">
                    <span class="">Visualização de notas</span>
                </button>
            </div>
    </section>
</body>

</html>
