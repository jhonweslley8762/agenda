<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda Escolar</title>

  <!-- Fontes: Manrope para títulos, Inter para o corpo do texto -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!--
    É só dar duplo clique neste arquivo para abrir o app.

    Esta é a única página de verdade: as telas (boas-vindas,
    login, cadastro...) ficam na pasta /pages e são colocadas
    dentro de #app-content conforme o usuário navega. Por isso
    o app nunca sai da aba nem recarrega.
  -->
  <div class="app-shell">

    <!-- ===================== PAINEL DE MARCA ===================== -->
    <!-- Fica sempre visível (não é trocado ao navegar) e só
         aparece em telas grandes — ver a media query de 1024px
         no css/style.css. -->
    <aside class="brand-panel">
      <div class="brand-blob blob-1"></div>
      <div class="brand-blob blob-2"></div>

      <div class="brand-top">
        <div class="brand-logo">
          <span class="icon">🎓</span>
          <span class="brand-name">Agenda Escolar</span>
        </div>
        <p class="brand-tagline">Acompanhe tudo o que acontece na escola em um só lugar.</p>
      </div>

      <!-- Progresso do fluxo; o app.js marca a etapa atual -->
      <ol class="steps" id="steps-list">
        <li class="step" data-step="0"><span class="step-dot">1</span><span class="step-label">Boas-vindas</span></li>
        <li class="step" data-step="1"><span class="step-dot">2</span><span class="step-label">Perfil</span></li>
        <li class="step" data-step="2"><span class="step-dot">3</span><span class="step-label">Dados de acesso</span></li>
        <li class="step" data-step="3"><span class="step-dot">4</span><span class="step-label">Pronto</span></li>
      </ol>

      <p class="brand-footer">✨ feito para alunos, professores, gestão e responsáveis</p>
    </aside>

    <!-- ===================== ÁREA DAS TELAS ===================== -->
    <main class="content">
      <!-- O router.js troca o conteúdo daqui a cada navegação -->
      <div id="app-content"></div>
    </main>

  </div>

  <!-- ===================== SCRIPTS =====================
       A ordem importa:
       1. pages.js      cria o objeto PAGES (vazio)
       2. pages/*.js    cada tela se registra dentro dele
       3. storage.js    salvar/ler dados no navegador
       4. router.js     navegação entre as telas
       5. app.js        lógica do app (usa todos os anteriores)
  -->
  <script src="js/pages.js"></script>

  <script src="pages/welcome.js"></script>
  <script src="pages/role.js"></script>
  <script src="pages/login.js"></script>
  <script src="pages/cadastro.js"></script>
  <script src="pages/perfil.js"></script>
  <script src="pages/dashboard.js"></script>

  <!-- Telas da área do estudante -->
  <script src="pages/estudante.js"></script>
  <script src="pages/pagina-pessoal.js"></script>
  <script src="pages/boletim.js"></script>
  <script src="pages/anotacoes.js"></script>
  <script src="pages/informacoes.js"></script>
  <script src="pages/grupos.js"></script>
  <script src="pages/sala-aluno.js"></script>
  <script src="pages/calendario.js"></script>
  <script src="pages/chat-sala.js"></script>
  <script src="pages/chat-gerencia.js"></script>
  <script src="pages/pagina-escolar.js"></script>

  <script src="js/storage.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
