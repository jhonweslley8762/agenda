<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página inicial - Login</title>
    <link rel="stylesheet" href="css/login/style.css">
    <link rel="stylesheet" href="css/start-style/styleStart.css">
</head>
<body>

    <!-- container que centraliza todo o site no meio da tela-->
    <div class="container-site">
        <div id="fundo-branco-login">
            <div id="container-imagem-mensagem-login">
                <!-- imagem do figma e mensagem de boas vindas do site-->

                <img src="img/alunos.png" alt="imagem de alunos" id="imagem-login">
                <h1 id="mensagem-boas-vindas" class="mensagem">bem vindo! para acessar a agenda é necessário que faça o
                    cadastro, caso já possua uma conta clique em login.</h1>
            </div>
        
            
            <div id="quadro-de-login">
                <div id="opcao-login-usuario-senha" class="opção-azul paginas-botoes">
                    <h1>
                        login com usuario e senha
                    </h1>
                </div>
                <div id="opcao-cadastro-agenda" class="opção-verde paginas-botoes">
                    <h1>cadastrar conta na agenda</h1>
                </div>
            </div>

        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
